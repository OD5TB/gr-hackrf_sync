id: hackrf_sync_sync_source
label: HackRF Sync Source
category: '[HACKRF_SYNC]'

parameters:
- id: serial
  label: Serial Number
  dtype: string
  default: '""'
- id: freq
  label: Center Freq (Hz)
  dtype: real
  default: 145e6
- id: samp_rate
  label: Sample Rate (Hz)
  dtype: real
  default: 1e6
- id: bandwidth
  label: Bandwidth (Hz)
  dtype: real
  default: 1e6
- id: if_gain
  label: IF Gain (0-40)
  dtype: int
  default: 20
- id: bb_gain
  label: BB Gain (0-62)
  dtype: int
  default: 20
- id: rf_amp
  label: RF Gain (14dB)
  dtype: bool
  default: 'False'
  options: ['True', 'False']
  option_labels: ['On', 'Off']
- id: hw_sync
  label: Hardware Sync
  dtype: bool
  default: 'False'
  options: ['False', 'True']
  option_labels: ['Slave (Wait)', 'Master (Fire)']

templates:
  imports: from gnuradio import hackrf_sync
  make: hackrf_sync.sync_source(${serial}, ${freq}, ${samp_rate}, ${bandwidth}, ${if_gain}, ${bb_gain}, ${rf_amp}, ${hw_sync})

file_format: 1
